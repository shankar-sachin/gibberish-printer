<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibberish Printer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2390e8ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236692ff%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230b1427%22%2F%3E%3Cpath%20d%3D%22M43%2020a19%2019%200%201%200%202%2022V32H32%22%20fill%3D%22none%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2247%22%20cy%3D%2215%22%20r%3D%223%22%20fill%3D%22%23d5f8ff%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#eff5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px 20px;background:radial-gradient(circle at 15% 5%,#193458 0,transparent 38%),radial-gradient(circle at 90% 85%,#18234b 0,transparent 36%),#0b1020}main{max-width:840px;margin:auto}.eyebrow{color:#87d3ff;font-size:.8rem;font-weight:800;letter-spacing:.17em;text-transform:uppercase}h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.065em;margin:12px 0}p{color:#a5b3ca;line-height:1.5}.panel{margin-top:30px;background:#121c30db;border:1px solid #4354757d;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0005}.row{display:flex;gap:18px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}label,.legend{display:block;color:#cbd7ea;font-size:.85rem;font-weight:700;margin-bottom:10px}input{width:100%;background:#0b1427;color:#fff;border:1px solid #485a79;border-radius:12px;padding:14px 16px;font:inherit;font-size:1.1rem}input:focus,button:focus-visible{outline:2px solid #80d2ff;outline-offset:3px}.switch{display:flex;background:#0b1427;border:1px solid #485a79;border-radius:13px;padding:4px;width:max-content;max-width:100%}.switch button{border:0;background:transparent;color:#afbdd4;border-radius:9px;padding:12px 20px;cursor:pointer;font:inherit;font-weight:700}.switch button.active{color:#071425;background:#93dcff}.primary{background:#9de1ff;color:#091528;border:0;border-radius:12px;padding:15px 25px;font:inherit;font-weight:850;cursor:pointer;white-space:nowrap}.primary:hover,.switch button:hover,.subtle:hover{filter:brightness(1.12)}.outputHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 12px}.outputHead h2{font-size:1rem;margin:0}.actions{display:flex;gap:9px}.subtle{background:#20324d;border:1px solid #526782;color:#eaf5ff;border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;font-size:.85rem}.subtle:disabled{opacity:.45;cursor:default}#output{white-space:pre-wrap;overflow-wrap:anywhere;min-height:170px;max-height:45vh;overflow:auto;margin:0;background:#090f1d;border:1px solid #394a67;border-radius:14px;padding:20px;color:#daf1ff;font:1rem/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}#status{min-height:1.4em;margin-top:12px;font-size:.85rem;color:#a7b8ce}@media(max-width:570px){body{padding:26px 14px}.panel{padding:18px}.switch,.switch button{flex:1}.primary{width:100%}}
</style>
</head>
<body><main>
<div class="eyebrow">Random text machine</div><h1>Gibberish Printer</h1><p>Pick a count, choose characters or words, and let the nonsense commence.</p>
<section class="panel"><div class="row"><div class="field"><span class="legend">Generate by</span><div class="switch" role="group" aria-label="Unit"><button type="button" class="active" data-mode="characters" aria-pressed="true">Characters</button><button type="button" data-mode="words" aria-pressed="false">Words</button></div></div><div class="field"><label id="countLabel" for="count">Number of characters</label><input id="count" type="number" min="1" max="25000000" step="1" value="250" inputmode="numeric"></div><button class="primary" id="generate" type="button">Generate ↗</button></div><div class="outputHead"><h2>Output</h2><div class="actions"><button class="subtle" id="copy" type="button" disabled>Copy</button><button class="subtle" id="download" type="button" disabled>Download .txt</button></div></div><div id="output" role="region" aria-label="Generated gibberish">Your gibberish will show up here.</div><div id="status" role="status" aria-live="polite">Up to 25,000,000 characters. Large results show a preview; download gets everything.</div></section>
</main><script>
const countEl=document.querySelector('#count'), output=document.querySelector('#output'), status=document.querySelector('#status');
const modeButtons=[...document.querySelectorAll('[data-mode]')];let mode='characters',generatedChunks=[],generatedMode='characters',busy=false;
const consonants='bcdfghjklmnpqrstvwxyz',vowels='aeiou',alphabet='abcdefghijklmnopqrstuvwxyz';
function random(n){const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]%n}
function gibWord(){let s='';const syllables=1+random(3);for(let i=0;i<syllables;i++){if(random(8)!==0)s+=consonants[random(consonants.length)];s+=vowels[random(vowels.length)];if(random(3)===0)s+=consonants[random(consonants.length)]}return s}
function setMode(next){if(busy)return;mode=next;for(const b of modeButtons){const selected=b.dataset.mode===mode;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',selected)}const isWords=mode==='words';countEl.max=isWords?'10000':'25000000';countEl.value=isWords?'50':'250';document.querySelector('#countLabel').textContent=`Number of ${mode}`;status.textContent=isWords?'Words are separated by single spaces.':'Up to 25,000,000 characters. Large results show a preview; download gets everything.'}
modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
async function generate(){if(busy)return;const n=Number(countEl.value),max=Number(countEl.max);if(!Number.isSafeInteger(n)||n<1||n>max){status.textContent=`Enter a whole number from 1 to ${max.toLocaleString()}.`;countEl.focus();return}busy=true;generatedChunks=[];generatedMode=mode;const button=document.querySelector('#generate');button.disabled=true;document.querySelector('#copy').disabled=true;document.querySelector('#download').disabled=true;output.textContent='Generating…';await new Promise(resolve=>setTimeout(resolve,0));try{if(mode==='words'){const words=new Array(n);for(let i=0;i<n;i++)words[i]=gibWord();generatedChunks=[words.join(' ')]}else{const decoder=new TextDecoder();let remaining=n;while(remaining>0){for(let batch=0;batch<8&&remaining>0;batch++){const size=Math.min(65536,remaining),bytes=new Uint8Array(size);crypto.getRandomValues(bytes);for(let i=0;i<size;i++)bytes[i]=97+bytes[i]%26;generatedChunks.push(decoder.decode(bytes));remaining-=size}status.textContent=`Generating… ${Math.round(100*(n-remaining)/n)}%`;await new Promise(resolve=>setTimeout(resolve,0))}}let preview='';for(const chunk of generatedChunks){preview+=chunk.slice(0,5000-preview.length);if(preview.length>=5000)break}output.textContent=preview+(n>5000&&mode==='characters'?'\n\n… Preview ends here. Copy or download for the full text.':'');status.textContent=`Generated exactly ${n.toLocaleString()} ${mode}.`+(mode==='characters'&&n>5000?' Showing the first 5,000 characters.':'');document.querySelector('#copy').disabled=false;document.querySelector('#download').disabled=false}catch(err){generatedChunks=[];output.textContent='Could not generate the text.';status.textContent=err.message||'Generation failed.'}finally{busy=false;button.disabled=false}}
document.querySelector('#generate').addEventListener('click',generate);countEl.addEventListener('keydown',e=>{if(e.key==='Enter')generate()});
document.querySelector('#copy').addEventListener('click',async()=>{const fullText=generatedChunks.join('');try{if(!navigator.clipboard?.writeText)throw Error('Clipboard API unavailable');await navigator.clipboard.writeText(fullText);status.textContent='Copied the full result to clipboard.'}catch{const area=document.createElement('textarea');area.value=fullText;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();status.textContent=copied?'Copied the full result to clipboard.':'Clipboard unavailable here; use Download .txt for the full result.'}});
document.querySelector('#download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob(generatedChunks,{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`gibberish-${generatedMode}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)});
</script></body></html>
